<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNsense DHCP viewer</title>
  <style>
    * {
      font-family: monospace;
    }

    .container {
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      margin-top: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    }

    main {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
    }

    .error {
      color: hsl(0 100% 20%);
      background-color: hsl(0 100% 90%);
      border: 1px solid hsl(0 100% 80%);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dhcp-table {
      width: 100%;
      text-align: left;
      margin-bottom: 20px;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: larger;
    }

    [hidden] {
      display: none !important;
    }

    .dhcp-table>tbody>tr>td {
      padding: 5px;
    }

    .dhcp-table>thead>tr>th {
      text-align: center;
      padding: 5px;
    }

    .entry-online>td {
      background-color: hsl(120 100% 90%);
    }

    .entry-offline>td {
      background-color: hsl(0 100% 90%);
    }

    button {
      padding: 10px;
      cursor: pointer;
      border-radius: 0;
      background-color: white;
      border: 1px solid black;
    }

    button:hover {
      background-color: #DDD;
    }

    button:active {
      background-color: #EEE;
    }

    button:disabled {
      color: #999;
      border-color: #999;
      cursor: default;
    }

    .centered {
      text-align: center;
    }

    .small-text {
      font-size: x-small;
    }

    .multi-td>div {
      background-color: transparent;
    }

    @media (prefers-color-scheme: dark) {
      * {
        background: #111;
        color: white;
      }

      button {
        border-radius: 0;
        background-color: #111;
        border: 1px solid white;
      }

      button:hover {
        background-color: #333;
      }

      button:active {
        background-color: #222;
      }

      button:disabled {
        border-color: #888;
        color: #888;
        background-color: #111;
      }

      .entry-online>td {
        background-color: hsl(120 100% 15%);
      }

      .entry-offline>td {
        background-color: hsl(0 100% 15%);
      }

      .error {
        border: 1px solid hsl(0 100% 30%);
        background-color: hsl(0 100% 20%);
      }

      .error>* {
        color: hsl(0 100% 80%);
        background-color: hsl(0 100% 20%);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h2>OPNsense DHCP dashboard</h2>
      <button id="refresh-button" disabled="disabled">Refresh</button>
    </header>
    <hr />
    <main>
      <div class="loading" id="loading-block">
        Loading...
      </div>
      <div class="error" id="error-block" hidden="hidden">
        <b>Error:</b>
        <div id="error-text"></div>
      </div>
      <table class="dhcp-table" id="table-block" hidden="hidden">
        <thead>
          <tr>
            <th></th>
            <th>IP</th>
            <th>Net</th>
            <th>Hostname</th>
            <th>MAC</th>
            <th>Started</th>
            <th>Description</th>
            <th>WiFi</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </main>
  </div>

  <script>

    document.addEventListener('DOMContentLoaded', () => {
      const refreshButton = document.querySelector('#refresh-button')
      const errorBlock = document.querySelector('#error-block')
      const errorText = document.querySelector('#error-text')
      const loadingBlock = document.querySelector('#loading-block')
      const tableBlock = document.querySelector('#table-block')
      const tableBody = document.querySelector('#table-body')

      function hide(element) {
        element.setAttribute('hidden', 'hidden')
      }

      function show(element) {
        element.removeAttribute('hidden')
      }

      function showError(error) {
        errorText.innerText = String(error)
        show(errorBlock)
      }

      function createTD(text, isCentered) {
        const element = document.createElement('td')
        if (isCentered) {
          element.classList.add('centered')
        }
        element.innerText = text
        return element
      }

      function showEntries(entries, wifiClients) {
        const parsedWifiClients = {}
        for (const client of wifiClients) {
          parsedWifiClients[client.mac] = client
        }

        entries.sort((a, b) => (-(a.startedAt ?? '').localeCompare(b.startedAt ?? '')) || a.network.localeCompare(b.network))
        tableBody.innerHTML = ''
        for (const entry of entries) {
          const tr = document.createElement('tr')
          tr.appendChild(createTD(entry.isStatic ? '💅' : '', true))
          tr.appendChild(createTD(entry.ip))
          tr.appendChild(createTD(entry.network === 'internal' ? '🏠' : (entry.network === 'guest' ? '👥' : entry.network), true))
          tr.appendChild(createTD(entry.hostname))

          const macTd = document.createElement('td')
          macTd.classList.add('multi-td')
          const macText = document.createElement('div')
          macText.innerText = entry.mac
          macTd.appendChild(macText)
          const vendorText = document.createElement('div')
          vendorText.classList.add('small-text')
          vendorText.innerText = entry.ouiVendor
          macTd.appendChild(vendorText)
          tr.appendChild(macTd)

          tr.appendChild(createTD(entry.startedAt ? new Date(entry.startedAt).toLocaleString() : '-'))
          tr.appendChild(createTD(entry.description))
          tr.classList.add(entry.isOnline ? 'entry-online' : 'entry-offline')
          tableBody.appendChild(tr)

          const wifiClient = parsedWifiClients[entry.mac]
          if (wifiClient) {
            const wifiTd = document.createElement('td')
            wifiTd.classList.add('multi-td')
            const essidText = document.createElement('div')
            essidText.innerText = `📡 ${wifiClient.essid}`
            wifiTd.appendChild(essidText)
            const apText = document.createElement('div')
            apText.classList.add('small-text')
            apText.innerText = wifiClient.ap
            wifiTd.appendChild(apText)
            tr.appendChild(wifiTd)
          } else {
            tr.appendChild(createTD('🌐'))
          }
        }
        show(tableBlock)
      }

      async function fetchLeases() {
        refreshButton.setAttribute('disabled', 'disabled')
        hide(errorBlock)
        hide(tableBlock)
        show(loadingBlock)

        try {
          const [leasesResponse, unifiResponse] = await Promise.allSettled([fetch('/api/leases'), fetch('/api/unifi')])
          let leases = null
          if (leasesResponse.status === 'rejected') {
            throw leasesResponse.reason
          }
          if (leasesResponse.value.status !== 200) {
            throw new Error(`Failed to fetch leases: ${leasesResponse.value.status} ${await leasesResponse.value.text()}`)
          }
          leases = await leasesResponse.value.json()
          let unifiClients = null
          if (unifiResponse.status === 'fulfilled') {
            if (unifiResponse.value.status === 200) {
              unifiClients = await unifiResponse.value.json()
            } else {
              console.error(`unifi error: ${unifiResponse.value.status} ${await unifiResponse.value.text()}`)
            }
          }
          showEntries(leases, unifiClients)
        } catch (error) {
          console.info(error)
          showError(error)
        } finally {
          hide(loadingBlock)
          refreshButton.removeAttribute('disabled')
        }
      }

      refreshButton.addEventListener('click', () => fetchLeases())
      fetchLeases()
    })
  </script>
</body>

</html>
